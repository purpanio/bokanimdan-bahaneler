<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Okan'ı Beklerken</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <a class="geri" href="index.html">bahanelere dön</a>

  <div id="secim-ekrani">
    <h1>Okan'ı Beklerken</h1>
    <p class="alt-baslik">Kime tıklarsan onun oyunu</p>

    <div id="yildiz"></div>
    <div id="digerleri"></div>

    <button id="basla" class="buton" disabled>Başla</button>
  </div>

  <div id="oyun-ekrani" class="gizli">
    <h1 id="oyun-adi"></h1>
    <p class="alt-baslik" id="oyun-aciklama"></p>

    <canvas id="tuval" width="360" height="540"></canvas>

    <div>
      <button id="menuye" class="oyun-link">karakter seç</button>
    </div>
  </div>

  <!-- Oyunlar once yuklenir, kendilerini window.oyunlar icine kaydeder -->
  <script src="oyunlar/flappy.js"></script>
  <script src="oyunlar/tepki.js"></script>
  <!-- Menu en son, cunku kayitli oyunlari kullanacak -->
  <script src="menu.js"></script>
</body>

</html>
